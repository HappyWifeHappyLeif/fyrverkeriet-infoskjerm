<!DOCTYPE html>
<html lang="no">

<head>
<meta charset="UTF-8">
<title>Fyrverkeriet Kulturhus og Bibliotek</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:40px;
}

h1{
    color:orange;
    margin-bottom:40px;
}

.event{
    background:#222;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
}

.title{
    font-size:28px;
    font-weight:bold;
}

.date{
    font-size:20px;
    color:#cccccc;
}

.location{
    font-size:18px;
    color:#aaaaaa;
}

</style>
</head>

<body>

<h1>Kommende arrangementer</h1>

<div id="events"></div>

<script>

fetch("events.json")
    .then(response => response.json())
    .then(data => {

        const container = document.getElementById("events");

      data.data
          .filter(event =>
              event.visibility === "visible" &&
              event.ticket_sale_type === "open"
          )
          .forEach(event => {

            const div = document.createElement("div");
            <div class="date">
            ${new Date(event.begin).toLocaleString('nb-NO')}
            </div>

            let sted = "";

            if(event.location && event.location.name){
                sted = event.location.name;
            }

            div.innerHTML = `
                <div class="title">${event.title}</div>
                <div class="date">${event.begin}</div>
                <div class="location">${sted}</div>
            `;

            container.appendChild(div);

        });

    });

</script>

</body>
</html>
