<!DOCTYPE html>
<html lang="no">

<head>
<meta charset="UTF-8">
<title>Fyrverkeriet Kulturhus og Bibliotek</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:40px;
}

h1{
    color:#ff8f0e;
    font-size:48px;
    margin-bottom:40px;
}

.event{
    background:#222;
    margin-bottom:40px;
    padding:20px;
    border-radius:12px;
}

.title{
    font-size:32px;
    font-weight:bold;
}

.date{
    font-size:22px;
    color:#cccccc;
}

.location{
    font-size:18px;
    color:#aaaaaa;
}

</style>
</head>

<body>

<h1>Kommende arrangementer</h1>

<div id="events"></div>

<script>

fetch("events.json")
    .then(response => response.json())
    .then(data => {

        const container = document.getElementById("events");

data.data
  .filter(event => event.visibility === "visible")
  .forEach(event => {

    const div = document.createElement("div");
    div.className = "event";

    div.innerHTML = `
      <div class="title">${event.title}</div>
      <div class="date">
  ${new Date(event.begin).toLocaleDateString('nb-NO', {
    day: 'numeric',
    month: 'long',
  })}
  ${new Date(event.begin).toLocaleTimeString('nb-NO', {
    hour: '2-digit',
    minute: '2-digit'
  })}
</div>
    `;

    container.appendChild(div);


            container.appendChild(div);

        });

    });

</script>

</body>
</html>
